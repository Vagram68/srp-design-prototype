const mediaBase='media/';
function srpVideo(name,poster,extra=''){return `<img class="srp-video-poster" src="${mediaBase}${poster}" alt=""><video class="srp-video" src="${mediaBase}${name}" poster="${mediaBase}${poster}" autoplay muted loop playsinline preload="metadata" aria-label="Оригинальное видео SRP" ${extra}></video>`;}
function mediaBanner(){const second=state.mediaSlide===1;return `<section class="video-banner">${srpVideo(second?'home-film-3.mp4':'home-film-2.mp4',second?'home-film-3-poster.jpg':'home-film-2-poster.jpg')}<div class="video-shade"></div><div class="video-banner-copy"><div class="eyebrow">ФЕДЕРАЛЬНАЯ СЕТЬ</div><img class="hero-wordmark" src="${mediaBase}srp-wordmark.svg" alt="СРП"><h2>Твоя игра. Твой клуб.</h2><p>Турниры и лиги по всей России</p>${link('tournaments','К турнирам','primary')}</div><div class="media-switch" aria-label="Видео главной">${[0,1].map(i=>`<button data-action="media-slide" data-value="${i}" aria-label="Видео ${i+1}" aria-pressed="${(state.mediaSlide||0)===i}">${i+1}</button>`).join('')}</div></section>`;}
function leagueMedia(route,title,copy,name,poster){return `<a href="#${route}" data-route="${route}" class="league-media">${srpVideo(name,poster)}<div class="video-shade"></div><div class="league-media-copy"><h3>${title}</h3><p>${copy}</p></div></a>`;}
function rail(){return `<aside class="account-rail" aria-label="Быстрый доступ">${link('profile',avatar(),'rail-avatar')}<strong>${esc(state.nick)}</strong><small>${esc(clubData[state.club][0])}</small>${link('tournaments','Турниры','rail-entry')}${link('rating',ic('trophy')+'Рейтинг','rail-entry')}${link('achievements',ic('star')+'Достижения','rail-entry')}${link('loyalty',ic('card')+'Лояльность','rail-entry')}${link('notifications',ic('bell')+'Уведомления','rail-entry')}${link('settings',ic('settings')+'Настройки','rail-entry')}</aside>`;}

const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`;
const btn=(t,a,c='secondary',more='')=>`<button class="${c}" data-action="${a}" ${more}>${t}</button>`;
const link=(page,t,c='',more='')=>`<a href="#${page}" data-route="${page}" class="${c}" ${more}>${t}</a>`;
const initials=n=>n.split(' ').filter(Boolean).map(p=>p[0]).slice(0,2).join('').toUpperCase();
function avatar(n=state.nick,large=false){return `<span class="avatar ${large?'large':''}">${state.avatar&&n===state.nick?`<img alt="Фото профиля" src="${state.avatar}">`:esc(initials(n))}</span>`;}
function pageHead(t,sub='',actions=''){return `<div class="page-head"><div><div class="eyebrow">${sub||'Milli Club · Казань'}</div><h1>${t}</h1></div><div class="head-actions">${actions}</div></div>`;}
function back(to='home',t='Назад'){return link(to,ic('back')+t,'back');}
function tabs(items,value,action){return `<div class="tabs" role="group" aria-label="Разделы">${items.map(t=>`<button class="${value===t?'active':''}" data-action="${action}" data-value="${t}" aria-pressed="${value===t}">${t}</button>`).join('')}</div>`;}
function tabline(items,value,action){return `<div class="tabline" role="group" aria-label="Вкладки">${items.map(t=>`<button class="${value===t?'active':''}" data-action="${action}" data-value="${t}" aria-pressed="${value===t}">${t}</button>`).join('')}</div>`;}
function field(label,name,type='text',value='',extra=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function searchBox(ph,kind='events'){return `<label class="search">${ic('search')}<input type="search" data-search="${kind}" aria-label="${ph}" placeholder="${ph}" value="${esc(state.search)}"></label>`;}
function empty(t,p='',action='',compact=false){return `<div class="empty ${compact?'compact':''}"><div class="empty-icon">${ic('empty')}</div><h3>${t}</h3><p>${p}</p>${action}</div>`;}
function accountNav(active){return `<nav class="account-subnav" aria-label="Разделы аккаунта">${[['profile','Аккаунт'],['history','История'],['achievements','Достижения'],['statistics','Статистика'],['settings','Настройки']].map(([id,t])=>link(id,t,id===active?'active':'')).join('')}</nav>`;}
function clubSelect(action='league-club'){return `<select aria-label="Выбор клуба" data-select="${action}">${clubData.map((c,i)=>`<option value="${i}" ${i===state.club?'selected':''}>${esc(c[0])} · ${esc(c[1])}</option>`).join('')}</select>`;}
function visibleEvents(){return events.filter(e=>(state.filter==='Все'||(state.filter==='Мои'?state.registered.includes(e.id):e.type===state.filter))&&(state.dateFilter==='Все даты'||e.date===state.dateFilter)&&e.name.toLowerCase().includes(state.search.toLowerCase()));}
function eventRows(items=visibleEvents()){return `<div class="panel lobby-list"><div class="list-labels"><span>Начало</span><span>Турнир</span><span>Игроки</span><span>Статус</span></div>${items.map(e=>`<button class="event-row ${state.selected===e.id?'selected':''}" data-action="select-event" data-value="${e.id}" aria-pressed="${state.selected===e.id}"><span class="time">${e.time}<small class="date">${e.date}.2026</small></span><span><span class="event-name">${e.name}</span><span class="event-meta">Холдем · ${e.type}</span></span><span class="event-count">${state.registered.includes(e.id)?1:0} / ${e.cap}</span><span class="event-status">${pill(state.registered.includes(e.id)?'Вы записаны':'Открыт',state.registered.includes(e.id)?'gold':'green')}</span></button>`).join('')||empty('Турниры не найдены','Попробуйте другую дату или название.',btn('Сбросить фильтры','clear-filters','secondary small'))}</div>`;}
function eventCards(items){return `<div class="cards">${items.map(e=>`<article class="panel event-card"><div class="event-card-top"><span>${e.type==='Лига'?'ЛИГИ SRP':e.type==='Сателлит'?'САТЕЛЛИТ':'MILLI CLUB'}</span><span class="suit" aria-hidden="true">♠</span></div><div class="event-card-body"><h3>${e.name}</h3><div class="event-meta">Холдем · Казань</div><div class="card-facts"><span>${e.date} · ${e.time}</span><span>${state.registered.includes(e.id)?1:0} / ${e.cap}</span></div><button class="${state.registered.includes(e.id)?'secondary':'primary'} block" data-action="open-event" data-value="${e.id}">${e.route?'Исследовать':state.registered.includes(e.id)?'Моя запись':'Открыть турнир'}</button></div></article>`).join('')}</div>`;}
function structureTable(){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Ур.</th><th class="num">SB</th><th class="num">BB</th><th class="num">Ante</th><th class="num">Мин.</th></tr></thead><tbody>${blinds.map((b,i)=>`<tr><td>${i+1}</td>${b.map((n,j)=>`<td class="num">${num(n)}${j===3?':00':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function participantTable(league=false){if(league||!state.registered.includes(state.selected))return empty('Участников пока нет',league?'Состав участников появится после формирования списка.':'Будьте первым участником этого турнира.','',true);return `<table class="data-table"><thead><tr><th>Игрок</th><th class="num">Клуб</th></tr></thead><tbody><tr><td>${avatar()} ${esc(state.nick)}</td><td class="num">Milli Club</td></tr></tbody></table>`;}
function registerButton(){const e=events[state.selected];if(e.route)return link(e.route,'Исследовать лигу','primary block');return btn(state.registered.includes(e.id)?'Отменить запись':'Записаться на турнир',state.registered.includes(e.id)?'cancel-registration':'register-event',state.registered.includes(e.id)?'secondary block':'primary block');}
function eventDetail(){const e=events[state.selected];return `<aside class="panel event-detail"><div class="detail-art"><div class="eyebrow">${e.type} · SRP</div><h2>${e.name}</h2><p>Milli Club · Казань</p><span class="art-symbol" aria-hidden="true">♠</span></div><div class="detail-body">${pill(state.registered.includes(e.id)?'Вы записаны':'Регистрация открыта',state.registered.includes(e.id)?'gold':'green')}<dl class="facts"><div><dt>Дата</dt><dd>${e.date}.2026</dd></div><div><dt>Начало</dt><dd>${e.time}</dd></div><div><dt>Участники</dt><dd>${state.registered.includes(e.id)?1:0} / ${e.cap}</dd></div><div><dt>Вид игры</dt><dd>${e.game}</dd></div></dl><div class="detail-tabs">${['О турнире','Участники','Структура'].map(t=>`<button data-action="detail-tab" data-value="${t}" class="${state.detailTab===t?'active':''}">${t}</button>`).join('')}</div><div class="detail-copy">${state.detailTab==='О турнире'?'<strong>Milli Club · Казань</strong><p>ул. Николая Ершова, 1А</p>':state.detailTab==='Участники'?participantTable():`<p>25 уровней · SB / BB / Ante</p>${link('tournament','Смотреть структуру','text-link')}`}</div>${registerButton()}${btn('Подробности турнира','event-details','ghost block small')}</div></aside>`;}
function home(){return mediaBanner()+`<div class="section-head"><h2>Ближайшие турниры</h2>${link('tournaments','Все турниры')}</div>${eventCards(events.slice(0,3))}<div class="section-head"><h2>Лиги SRP</h2>${link('leagues','Все лиги')}</div><div class="grid2">${leagueMedia('leagues','Лига Городов','10–11 октября · Казань','zemlya.mp4','zemlya-poster.jpg')}${leagueMedia('ambassadors','Лига Амбассадоров','Амбассадорская покерная лига · Скоро','ambassador.mp4','ambassador-poster.jpg')}</div><div class="grid2" style="margin-top:16px">${link('about',`<div><h3>SRP · Наша сеть</h3><p>Клубы, правила и сообщество</p></div>${ic('network')}`,'panel link-panel')}${link('support',`<div><h3>QA · Поддержка</h3><p>Вопросы по приложению</p></div>${ic('help')}`,'panel link-panel')}</div>`;}

function tournaments(){return pageHead('Турниры','Milli Club · Расписание',pill('7–11 октября'))+`<div class="toolbar">${searchBox('Найти турнир')}<select data-select="date" aria-label="Дата турнира">${['Все даты','07.10','08.10','09.10','10.10','11.10'].map(d=>`<option ${state.dateFilter===d?'selected':''}>${d}</option>`).join('')}</select><span class="count" id="event-count">${visibleEvents().length} событий</span></div><div class="toolbar"><div class="filter-chips">${['Все','Клубный','Лига','Сателлит','Мои'].map(t=>`<button data-action="event-filter" data-value="${t}" class="${state.filter===t?'active':''}" aria-pressed="${state.filter===t}">${t==='Клубный'?'Клубные':t==='Лига'?'Лиги':t==='Сателлит'?'Сателлиты':t}</button>`).join('')}</div></div><div class="split"><div id="event-list">${eventRows()}</div>${eventDetail()}</div>`;}
function tournament(){const e=events[state.selected];return back('tournaments','Все турниры')+`<div class="event-art"><div class="eyebrow">${e.type} · Холдем</div><h1>${e.name}</h1><p class="subheading">Milli Club · Казань</p><span class="art-symbol" aria-hidden="true">♠</span></div><div class="event-page-grid"><div class="panel event-page-body">${tabline(['О турнире','Участники','Структура'],state.detailTab,'detail-tab')}<div>${state.detailTab==='Структура'?structureTable():state.detailTab==='Участники'?participantTable():`<div class="info-block"><h3>Когда</h3><p>${e.date}.2026, ${e.time}</p></div><div class="info-block"><h3>Локация</h3><p>Казань, ул. Николая Ершова, 1А</p>${btn('Открыть локацию','location','secondary small')}</div><div class="info-block"><h3>Вид игры</h3><p>${e.game} · Холдем</p></div>`}</div></div><aside class="panel panel-pad">${pill(state.registered.includes(e.id)?'Вы записаны':'Регистрация открыта',state.registered.includes(e.id)?'gold':'green')}<dl class="facts"><div><dt>Дата</dt><dd>${e.date}.2026</dd></div><div><dt>Начало</dt><dd>${e.time}</dd></div><div><dt>Участники</dt><dd>${state.registered.includes(e.id)?1:0} / ${e.cap}</dd></div><div><dt>Клуб</dt><dd>Milli Club</dd></div></dl>${registerButton()}<div class="event-side-info"><div class="note">Запись сохраняется в личном кабинете.</div>${link('history','Мои турниры','ghost block small')}</div></aside></div>`;}
function completed(){const p=past[state.pastIndex];return back('history','История турниров')+pageHead(p[0],'Завершённый турнир · '+p[1]+'.2026',pill('Завершён'))+`<div class="event-page-grid"><div class="panel event-page-body">${tabline(['О турнире','Лидерборд','Очки'],state.completedTab||'О турнире','completed-tab')}${state.completedTab==='Лидерборд'?`<div class="note">Состав строк демонстрационный. Ваше место взято из истории SRP.</div><table class="data-table"><thead><tr><th>Место</th><th>Игрок</th><th class="num">Результат</th></tr></thead><tbody>${players.slice(0,3).map((p,i)=>`<tr><td class="rank">${i+1}</td><td>${link('player',p[0],'',`data-player="${i}"`)}</td><td class="num">Топ-${i+1}</td></tr>`).join('')}<tr style="background:#36242a"><td class="rank">${p[2]}</td><td>${esc(state.nick)}</td><td class="num">${p[2]} место</td></tr></tbody></table>`:state.completedTab==='Очки'?`<div class="stats-grid" style="grid-template-columns:1fr 1fr"><div class="stat"><b>710,41</b><span>Пулл очков</span></div><div class="stat"><b>1 032</b><span>Средний рейтинг турнира</span></div></div>`:`<div class="info-block"><h3>Когда</h3><p>${p[1]}.2026 · 18:00</p></div><div class="info-block"><h3>Что вас ждёт</h3><p>Баунти турнир! За выбивание игрока даётся 1 баунти с 5 XP.</p></div><div class="info-block"><h3>Локация</h3><p>Казань, ул. Николая Ершова, 1А</p></div><div class="info-block"><h3>Вид игры</h3><p>KO</p></div>`}</div><aside class="panel panel-pad"><div class="eyebrow">Ваш результат</div><div class="stat" style="border:0;padding:12px 0 23px"><b>${p[2]} место</b><span>Холдем · ${p[1]}.2026</span></div>${link('statistics','Моя статистика','secondary block')}</aside></div>`;}
function history(){const upcoming=state.registered.map(i=>events[i]);return accountNav('history')+pageHead('История турниров','Мои игры',pill('79 игр'))+tabs(['Мои','Все'],state.historyTab,'history-tab')+`${upcoming.length?`<div class="section-head"><h2>Предстоящие</h2></div>${eventCards(upcoming)}`:''}<div class="section-head"><h2>${state.historyTab==='Мои'?'Сыгранные турниры':'Архив турниров клуба'}</h2></div><div class="panel table-wrap"><table class="data-table"><thead><tr><th>Турнир</th><th>Дата</th><th class="num">Место</th></tr></thead><tbody>${past.slice(0,state.historyLimit).map((p,i)=>`<tr><td>${link('completed',p[0],'',`data-past="${i}"`)}<div class="event-meta">Холдем · Milli Club</div></td><td>${p[1]}</td><td class="num">${p[2]}</td></tr>`).join('')}</tbody></table></div>${state.historyLimit<past.length?`<div style="text-align:center;margin-top:18px">${btn('Показать ещё','more-history','secondary')}</div>`:''}<div class="note">В прототипе — фрагмент истории для проверки переходов. Рабочая версия загрузит все записи.</div>`;}
function leagues(){return pageHead('Лиги SRP','Сезон 2026')+tabs(['Городов','Чемпионов','Рейтинга'],state.league,'league')+(state.league==='Городов'?`<div class="section-head"><h2>Ближайшие события</h2></div>${eventCards(events.slice(6,8))}`:state.league==='Чемпионов'?`<div class="toolbar">${clubSelect()}<span class="count">Отбор представителей клуба</span></div><div class="round-list">${[1,2,3,4,5,6].map(n=>`<div class="round-row"><div><div class="eyebrow">Тур ${n}</div><h3>${n<4?'Финал':'Раунды и финал'}</h3><div class="muted" style="margin-top:5px">${n===1?'Олег Дегтярев':n===2?'Ильдар Байтимиров':n===3?'Победитель не определён':'Сезон 2026'}</div></div><button class="secondary" data-action="champion-round" data-value="${n}">Открыть</button></div>`).join('')}</div>`:`<div class="toolbar">${clubSelect()}<span class="count">Год клуба</span></div><div class="panel link-panel"><div><div class="eyebrow">Октябрь 2026</div><h2>Топ-1 · Амир Нуриев</h2><p>Путь к финальному столу клуба</p></div>${link('rating-event','Открыть','primary')}</div>`);}
function leagueContent(kind){const names=kind==='cities'?['О турнире','В финал','Участники','Структура']:['О турнире','Сетка','Победители','Участники','Структура'];const tab=names.includes(state.leagueTab)?state.leagueTab:'О турнире';let body='';if(tab==='Структура')body=structureTable();else if(tab==='Участники')body=participantTable(true);else if(tab==='В финал')body=empty('Отбор ещё не завершён','Список прошедших появится после завершения отбора.');else if(tab==='Победители')body=empty('Победитель ещё не определён','Результат появится после завершения финала.');else if(tab==='Сетка')body=`<div class="bracket"><div class="bracket-col"><h3>Отбор клуба</h3><div class="bracket-item winner">Амир Нуриев<small>Топ-1 · Октябрь 2026</small></div><div class="bracket-item">Победитель отборочного<small>Октябрь 2026</small></div><div class="bracket-item">Топ-1<small>Ноябрь 2026</small></div><div class="bracket-item">Победитель отборочного<small>Ноябрь 2026</small></div></div><div class="bracket-col"><h3>Финал клуба</h3><div class="bracket-item">Milli Club · Казань<small>Победитель финального стола</small></div></div><div class="bracket-col"><h3>Финал сети</h3><div class="bracket-item">Победители клубов SRP<small>Финал года клубов</small></div></div></div>`;else{const title=kind==='cities'?'Лига Городов':kind==='champions'?'Лига Чемпионов':'Лига Рейтинга';const text=kind==='cities'?'Главный турнир месяца сети SRP. За одним столом встречаются лучшие игроки всех клубов: города спорят за титул, а победитель становится чемпионом Лиги Городов.':kind==='rating'?'На протяжении зачётного года игроки клуба соревнуются за лидерство в ежемесячном рейтинге. Победитель месяца получает место на финальном столе клуба. Победитель финала клуба получает билет на финал года клубов SRP.':'Этапы отбора определяют игрока, который представляет клуб. Сохранены туры, раунды и финалы.';body=`<details class="disclosure" open><summary>Что такое ${title}</summary><p>${text}</p></details>${kind==='cities'?`<details class="disclosure" open><summary>Когда</summary><p>${state.selected===7?'11 октября, 14:00':'10 октября, 16:00'}</p></details><details class="disclosure" open><summary>Локация</summary><p>Казань, ул. Николая Ершова, 1А</p></details>`:''}`;}return tabline(names,tab,'league-tab')+body;}
function leagueEvent(kind){const title=kind==='cities'?`Лига Городов · ${state.selected===7?'Final':'1A'}`:kind==='champions'?`Лига Чемпионов · Тур ${state.round}`:'Лига Рейтинга';return back('leagues','Лиги SRP')+`<div class="event-art"><div class="eyebrow">${kind==='cities'?'Чемпионат клубов · Казань':'Milli Club · Казань'}</div><h1>${title}</h1><p class="subheading">${kind==='cities'?'Главный турнир месяца':kind==='champions'?'Отбор клуба':'Битва сильнейших'}</p></div><div class="panel event-page-body">${kind==='rating'?`<div style="margin-bottom:15px">${pill('Идёт формирование игроков','gold')}</div>`:''}${kind==='champions'?`<div class="toolbar"><select data-select="round-stage" aria-label="Раунд">${['Финал','Раунд 1','Раунд 2','Раунд 3','Раунд 4','Раунд 5','Раунд 6','Раунд 7','Раунд 8'].map(t=>`<option ${state.roundStage===t?'selected':''}>${t}</option>`).join('')}</select></div>`:''}${leagueContent(kind)}</div>`;}
function clubCards(){let cs=clubData.map((c,i)=>({c,i})).filter(({c})=>c.join(' ').toLowerCase().includes(state.search.toLowerCase()));if(state.clubsTab==='Новые')return empty('Новые клубы','Список новых клубов не загрузился на текущем сайте. Экран сохранён для сверки.');return `<div class="club-grid">${cs.map(({c,i})=>`<article class="panel club-card"><div class="club-card-banner"><span class="club-initials">${esc(initials(c[0]))}</span>${i===state.club?pill('Мой клуб','gold'):ic('pin')}</div><div class="club-card-body"><div class="eyebrow">${esc(c[1])}</div><h3>${esc(c[0])}</h3><p>Клуб сети SRP</p>${link('club','О клубе','secondary block',`data-club="${i}"`)}</div></article>`).join('')||empty('Клубы не найдены','Попробуйте другой город или название.')}</div>`;}
function clubs(){return pageHead('Наши клубы','Федеральная сеть SRP')+`<div class="tabs">${['Все','Новые','Карта'].map(t=>`<button data-action="clubs-tab" data-value="${t}" class="${state.clubsTab===t?'active':''}">${t}</button>`).join('')}</div><div class="toolbar">${searchBox('Клуб или город','clubs')}<span class="count">${clubData.length} клубов в списке лиг</span></div><div id="club-list">${clubCards()}</div>`;}
function club(){const i=state.clubDetail??state.club,c=clubData[i];return back('clubs','Наши клубы')+`<div class="event-art"><div class="eyebrow">${esc(c[1])} · SRP</div><h1>${esc(c[0])}</h1><p class="subheading">Клуб спортивно-развлекательного покера</p></div><div class="grid2"><div class="panel panel-pad"><h2>О клубе</h2><div class="info-line"><span>Город</span><strong>${esc(c[1])}</strong></div><div class="info-line"><span>Формат</span><strong>Покер не на деньги</strong></div><div class="info-line"><span>Адрес</span><strong>${i===0?'ул. Николая Ершова, 1А':'Уточняется у клуба'}</strong></div><div style="margin-top:20px">${btn(i===state.club?'Ваш клуб':'Выбрать клуб','choose-club',i===state.club?'secondary block':'primary block',`data-value="${i}"`)}</div></div><div class="panel panel-pad"><h2>События и рейтинг</h2><div style="display:grid;gap:12px;margin-top:21px">${link('tournaments','Турниры клуба','secondary block')}${link('rating','Рейтинг игроков','secondary block')}${link('map','Карта клубов','secondary block')}</div><div class="note">Сведения клуба, кроме Milli Club, требуют проверки: каталог текущего сайта не загрузился.</div></div></div>`;}
function map(){const c=clubData[state.mapClub];return pageHead('Карта клубов','Наши клубы')+`<div class="tabs"><button data-action="clubs-tab" data-value="Все">Все</button><button data-action="clubs-tab" data-value="Новые">Новые</button><button class="active">Карта</button></div><div class="map-layout"><div class="map-surface"><div class="map-fallback"><div>${ic('pin')}</div><h3>${esc(c[1])}</h3><p>${esc(c[0])}${state.mapClub===0?' · ул. Николая Ершова, 1А':''}</p><p>Картографический слой подключается в рабочей версии. Навигация по клубам доступна в прототипе.</p><button class="secondary" data-action="map-open-club">О клубе</button></div></div><div class="map-list">${[0,15,21,7,9,1].map(i=>`<button class="map-item ${state.mapClub===i?'active':''}" data-action="map-club" data-value="${i}">${esc(clubData[i][0])}<small>${esc(clubData[i][1])}</small></button>`).join('')}</div></div>`;}
function ratingRows(){return players.map((p,i)=>({p,i})).filter(({p})=>p[0].toLowerCase().includes(state.search.toLowerCase())).map(({p,i})=>`<tr><td class="rank">${i+1}</td><td>${link('player',`<span class="avatar">${initials(p[0])}</span>${esc(p[0])}`,'player-link',`data-player="${i}"`)}</td><td class="num">${num(p[1])}</td></tr>`).join('');}
function rating(){return pageHead('Рейтинг игроков','SRP · Сезон 2026')+tabs(['Мой клуб','Сеть','Неделя'],state.ratingTab,'rating-tab')+`<div class="toolbar">${searchBox('Найти игрока','players')}<span class="count">${state.ratingTab==='Мой клуб'?esc(clubData[state.club].join(' · ')):state.ratingTab==='Сеть'?'Федеральный рейтинг':'Рейтинг недели'}</span></div><div class="panel table-wrap"><table class="data-table"><thead><tr><th>Место</th><th>Игрок</th><th class="num">Рейтинг</th></tr></thead><tbody id="rating-body">${ratingRows()}</tbody></table></div>${state.ratingTab!=='Мой клуб'?'<div class="note">В этой вкладке использованы демонстрационные строки рейтинга Milli Club. Сортировка и состав требуют данных API.</div>':''}`;}
function player(){const p=players[state.player];return back('rating','Рейтинг игроков')+pageHead('Профиль игрока','SRP')+`<section class="profile-hero">${avatar(p[0],true)}<div><h2>${esc(p[0])}</h2><p class="muted">Milli Club · Казань</p></div><div class="head-actions">${pill(num(p[1])+' рейтинга','gold')}</div></section><div class="profile-menu">${[['player-history','history','Турниры','История игр'],['player-achievements','trophy','Достижения','Награды'],['player-statistics','chart','Статистика','Показатели']].map(([r,i,t,p])=>link(r,ic(i)+`<h3>${t}</h3><p>${p}</p>`,'panel')).join('')}</div>`;}
function playerClubTabs(){return tabs(['Milli Club · Казань','СРП · Набережные Челны'],state.publicClub||'Milli Club · Казань','public-club');}
function playerHistory(){const name=players[state.player][0];return back('player','Профиль игрока')+pageHead('Турниры',esc(name))+playerClubTabs()+`${state.publicClub==='СРП · Набережные Челны'?empty('История другого клуба','Компоновка выбора клуба сохранена. Данные второго клуба требуют API.'):state.player===0?`<div class="panel table-wrap"><table class="data-table"><thead><tr><th>Турнир</th><th>Дата</th><th class="num">Место</th></tr></thead><tbody>${publicPast.map((p,i)=>`<tr><td><button class="text-link" data-action="public-result" data-value="${i}">${p[0]}</button><div class="event-meta">Холдем</div></td><td>${p[1]}</td><td class="num">${p[2]}</td></tr>`).join('')}</tbody></table></div>`:empty('История игрока','Данные будут загружаться из публичного профиля SRP.')}`;}
function playerAchievements(){return back('player','Профиль игрока')+pageHead('Достижения',esc(players[state.player][0]))+tabs(['Обычные','Редкие'],state.achTab,'ach-tab')+`<div class="note">Компоновка коллекции показана на примере. Прогресс другого игрока загружается отдельно от вашего.</div>`+achievementCards(state.achTab==='Обычные'?ordinary:rare,0);}
function playerStatistics(){return back('player','Профиль игрока')+pageHead('Статистика',esc(players[state.player][0]))+playerClubTabs()+`<div class="stats-grid">${(state.player===0&&state.publicClub!=='СРП · Набережные Челны'?[[98,'Игр'],[1,'Топ-1'],[3,'Топ-3'],[11,'Топ-9']]:[['—','Игр'],['—','Топ-1'],['—','Топ-3'],['—','Топ-9']]).map(([n,t])=>`<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('')}</div><div class="grid2"><div class="panel panel-pad"><h2>Лучшие турниры · Топ-9</h2><div class="note">Лига Городов · Понедельник · Феникс · Короткий турнир · Sit&amp;Go · Кубковый турнир · Нокаут PKO · Mystery · LADY’S EVENT</div>${empty('Результаты по типам турниров','График загружается из статистики игрока.','',true)}</div><div class="panel panel-pad"><h2>Динамика мест</h2><div class="bar-chart" role="img" aria-label="Последние десять мест Амира Нуриева из истории турниров">${publicPast.slice().reverse().map(p=>`<div class="bar-wrap"><span class="bar-value">${p[2]}</span><div class="bar" style="height:${Math.max(8,150-p[2]*1.5)}px"></div></div>`).join('')}</div><div class="note">Демонстрация на публичных результатах Амира Нуриева. Полная динамика загружается из API.</div></div></div>`;}
function profile(){return pageHead('Мой аккаунт','Milli Club · Казань',link('settings',ic('settings')+'Настройки','secondary'))+`<section class="profile-hero">${avatar(state.nick,true)}<div><h2>${esc(state.nick)}</h2><p class="muted">${esc(clubData[state.club].join(' · '))}</p></div><div class="head-actions">${link('notifications',ic('bell')+'Уведомления','secondary')}</div></section><div class="profile-menu">${[['history','history','Турниры','История игр и результаты'],['achievements','trophy','Достижения','Награды и прогресс'],['statistics','chart','Статистика','Показатели и динамика'],['broadcast','play','Трансляция','Карточка игрока и анкета'],['push-settings','bell','Уведомления','Напоминания и события'],['settings','settings','Профиль','Фото и контактные данные']].map(([r,i,t,p])=>link(r,ic(i)+`<h3>${t}</h3><p>${p}</p>`,'panel')).join('')}</div>${link('loyalty',`<div><h3>Карта лояльности</h3><p>Раздел в разработке</p></div>${pill('Скоро','gold')}`,'loyalty')}<div class="section-head"><h2>Приложение</h2></div><div class="toolbar">${link('updates','v4.7.0 · Что нового','secondary small')}${link('privacy','Конфиденциальность','ghost small')}${link('consent','Обработка данных','ghost small')}</div>`;}

function about(){return pageHead('Наша сеть','Федеральная сеть SRP')+`<div class="grid2"><div class="panel panel-pad legal-copy"><h2 style="margin-top:0">Что такое SRP</h2><p>Спортивно-развлекательный покер — федеральная сеть клубов, объединяющая игроков и покерные пространства по всей России.</p><p>Интеллектуальная игра, соревнование, стратегия и общение. Участники соревнуются за рейтинг, достижения, статус и возможность представлять свой город на крупных соревнованиях.</p><h2>Правила</h2><p>В клубах SRP не играют на деньги. Игровые фишки не имеют денежной стоимости, денежные ставки и денежные выигрыши запрещены.</p><p>Единые правила поддерживают честную игру, уважение к соперникам и комфортную атмосферу во всех клубах.</p></div><div class="panel panel-pad legal-copy"><h2 style="margin-top:0">Почему мы</h2><p>Федеральный рейтинг, единая система соревнований и Лига Городов позволяют встречаться с игроками из других городов и представлять свой клуб на крупных турнирах.</p><h2>Клубы</h2><p>Москва, Санкт-Петербург, Екатеринбург, Казань, Набережные Челны и другие города. У каждого клуба своя атмосфера и сообщество.</p><div style="margin-top:24px">${link('clubs','Наши клубы','primary')}</div></div></div>`;}

function register(){return authShell(`<h1>Создать аккаунт</h1><p class="subheading">Присоединяйтесь к своему клубу SRP.</p><div class="tabs"><button class="active">Регистрация</button>${link('login','Вход','ghost')}</div><form id="register-form">${field('Никнейм','nick','text','','required placeholder="Ваш игровой никнейм"')}${field('Почта или телефон','identity','text','','required placeholder="Вымышленный контакт"')}${field('Пароль','password','password','','required minlength="8" autocomplete="off"')}<label class="field" style="margin-top:18px">Клуб<select name="club">${clubData.map((c,i)=>`<option value="${i}">${esc(c.join(' · '))}</option>`).join('')}</select></label><label class="check-line" style="margin-top:20px"><input type="checkbox" required name="consent">Согласен на обработку персональных данных и ознакомлен с политикой конфиденциальности.</label><div class="auth-errors" role="alert">${esc(state.authError)}</div><button class="primary block" type="submit">Зарегистрироваться</button></form><div class="auth-legal">Форма регистрации требует сверки с SRP. Реальный аккаунт не создаётся.<br>${link('privacy','Конфиденциальность')} · ${link('consent','Обработка данных')}</div>`);}
function reset(){return authShell(`${back('login','Вход')}<h1>Восстановить пароль</h1><p class="subheading">Введите почту или телефон, привязанные к аккаунту.</p><form id="reset-form">${field('Почта или телефон','identity','text','','required placeholder="Вымышленный контакт"')}<button type="submit" class="primary block">Получить код</button></form><div class="auth-legal">В прототипе код не отправляется. Сценарий восстановления требует сверки с SRP.</div>`);}
function verify(){return authShell(`${back(state.verifyPurpose==='reset'?'reset':state.verifyPurpose==='register'?'register':'settings','Назад')}<h1>Подтвердите контакт</h1><p class="subheading">Введите код подтверждения.</p><form id="verify-form">${field('Код','code','text','','required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456"')}<div class="note">Демонстрационный код: 123456</div><div class="auth-errors" role="alert">${esc(state.authError)}</div><button type="submit" class="primary block">Подтвердить</button></form>${btn('Получить код повторно','resend-code','ghost block small')}`);}

function isAuth(){return ['welcome','login','register','reset','verify'].includes(state.page);}

function specialState(){if(state.viewState==='loading')return pageHead('Загрузка','SRP')+`<div aria-busy="true" aria-label="Экран загружается"><div class="skeleton-line short"></div>${[0,1,2,3].map(()=>'<div class="skeleton-box"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>').join('')}</div>`;if(state.viewState==='error')return `<div class="panel">${empty('Не удалось загрузить данные','Проверьте подключение и попробуйте ещё раз.',btn('Повторить','normal-state','primary'))}</div>`;return `<div class="panel">${empty('Здесь пока нет данных','Когда появятся события или результаты, они будут доступны на этом экране.',btn('Вернуться к обычному экрану','normal-state','secondary'))}</div>`;}
function render(){if(!renderers[state.page])state.page='home';const s=screens.find(s=>s.id===state.page);document.getElementById('screen-caption').textContent=s.title;document.getElementById('coverage-caption').textContent=({verified:'Функция подтверждена в SRP',unavailable:'Раздел сохранён · содержимое требует сверки',inferred:'Предложенный сценарий · требуется сверка',new:'Новый экран для мобильного приложения'})[s.status];document.getElementById('screen-count').textContent=screens.length;const content=state.viewState==='normal'?renderers[state.page]():specialState();app.innerHTML=isAuth()&&state.viewState==='normal'?content:shell(content);document.title=`${s.title} · SRP · Прототип`;if(state.modal)renderModal();}
function navigate(page,options={}){state.page=page;state.viewState='normal';document.getElementById('state-picker').value='normal';state.search='';state.authError='';if(options.player!==undefined)state.player=options.player;if(options.club!==undefined)state.clubDetail=options.club;if(options.past!==undefined)state.pastIndex=options.past;closeReview();closeModal();render();try{if(location.hash.slice(1)!==page)window.history.replaceState(null,'','#'+page);}catch{}frame.scrollIntoView({behavior:'auto',block:'start'});}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('visible');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('visible'),3500);}
function closeModal(){state.modal=null;document.getElementById('modal-root').innerHTML='';if(state.previousFocus?.isConnected)state.previousFocus.focus();}

function openJourneys(){document.getElementById('review-drawer').hidden=false;document.getElementById('review-drawer').innerHTML=`<div class="drawer-overlay" data-action="drawer-overlay"><section class="review-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="journey-heading"><div class="review-drawer-head"><h2 id="journey-heading">Сценарии для проверки</h2>${btn(ic('close'),'close-review','icon-button','aria-label="Закрыть"')}</div>${[['welcome','Вход и регистрация','Старт → вход или регистрация → подтверждение → главная.'],['tournaments','Запись на турнир','Найти событие → открыть → записаться → успех → мои турниры → отменить запись.'],['history','Результаты турнира','История → прошедший турнир → лидерборд → очки → статистика.'],['leagues','Путь по лигам','Выбрать лигу → событие или этап → участники → структура → сетка и финал.'],['rating','Найти игрока','Клуб / сеть / неделя → поиск → публичный профиль.'],['achievements','Прогресс достижений','Обычные / редкие → награда → условия → прогресс.'],['settings','Настройки профиля','Фото → никнейм → контакты → код / звонок → пароль → привязки.'],['broadcast','Подготовка трансляции','Карточка игрока → имя и фото → все 11 вопросов анкеты → сохранение.'],['push-settings','Пуш-уведомления','Категории → согласие на приглашения → разрешение устройства → пример пуша.'],['clubs','Выбор клуба','Все / новые / карта → клуб → выбрать → турниры и рейтинг.']].map(([r,t,p])=>`<article class="journey"><h3>${t}</h3><p>${p}</p>${link(r,'Начать сценарий','primary small')}</article>`).join('')}</section></div>`;}

'telegram-login':()=>modal('Вход через Telegram','<p>В рабочей версии вход подтверждается в приложении Telegram. Здесь можно проверить переход после успешной авторизации.</p>',btn('Отмена','close-modal','secondary')+btn('Показать успешный вход','confirm-login','primary')),'confirm-login':()=>{navigate('home');toast('Добро пожаловать в SRP');},
'resend-code':()=>toast('Демонстрационный код: 123456'),
'sample-push':()=>modal('Предпросмотр пуша',`<div class="panel panel-pad" style="margin-bottom:20px"><div class="eyebrow">SRP · Сейчас</div><h3>Ваш турнир скоро начнётся</h3><p style="margin-top:8px">${events[state.selected].name} · Milli Club · ${events[state.selected].time}</p></div><p>Нажатие на уведомление открывает соответствующий турнир.</p>`,btn('Закрыть','close-modal','secondary')+btn('Открыть турнир','event-details','primary')),
'permission-preview':()=>modal('SRP хочет отправлять уведомления','<p>Уведомления могут включать напоминания, события клуба и результаты. Разрешение можно изменить в настройках устройства.</p><div class="note">Предпросмотр системного запроса. Разрешение устройства не меняется.</div>',btn('Не разрешать','permission-deny','secondary')+btn('Разрешить','permission-allow','primary')),
'permission-allow':()=>{closeModal();toast('Сценарий: разрешение получено');},'permission-deny':()=>{closeModal();toast('Сценарий: приложение работает без пушей');},
'read-notifications':()=>{state.readNotifications=true;render();toast('Уведомления отмечены прочитанными');},
'app-store':()=>modal('Установка на iPhone','<p>После публикации кнопка откроет страницу SRP в App Store. Установка приложения появится после разработки и модерации.</p>'),
'android-store':()=>modal('Установка на Android','<p>После публикации здесь будут ссылки на утверждённые страницы SRP в магазинах приложений.</p>'),
'web-install':()=>navigate('home')
};
document.addEventListener('click',ev=>{const target=ev.target.closest('[data-action],[data-route],[data-device]');if(!target)return;
if(target.dataset.device){state.device=target.dataset.device;frame.dataset.device=state.device;document.querySelectorAll('[data-device]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',String(b.dataset.device===state.device));});return;}
if(target.dataset.route){ev.preventDefault();navigate(target.dataset.route,{player:target.dataset.player!==undefined?Number(target.dataset.player):undefined,club:target.dataset.club!==undefined?Number(target.dataset.club):undefined,past:target.dataset.past!==undefined?Number(target.dataset.past):undefined});return;}
const act=target.dataset.action;if(act==='overlay-close'){if(ev.target===target)closeModal();return;}if(act==='drawer-overlay'){if(ev.target===target)closeReview();return;}if(actions[act]){ev.preventDefault();actions[act](target.dataset.value);}
});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.search){state.search=el.value;if(el.dataset.search==='events'){document.getElementById('event-list').innerHTML=eventRows();document.getElementById('event-count').textContent=visibleEvents().length+' событий';}if(el.dataset.search==='players'){document.getElementById('rating-body').innerHTML=ratingRows();}if(el.dataset.search==='clubs'){document.getElementById('club-list').innerHTML=clubCards();}}
if(el.closest('#broadcast-form')&&['last','first'].includes(el.name)){const form=document.getElementById('broadcast-form');document.getElementById('broadcast-preview-name').textContent=[form.elements.last.value,form.elements.first.value].filter(Boolean).join(' ')||'ИГРОК';}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='state-picker'){state.viewState=el.value;render();}if(el.dataset.select==='date'){state.dateFilter=el.value;render();}if(el.dataset.select==='league-club'){state.club=Number(el.value);save();render();}if(el.dataset.select==='round-stage'){state.roundStage=el.value;render();}if(el.dataset.push){state.push[el.dataset.push]=el.checked;save();toast('Настройки сохранены в прототипе');}if(el.hasAttribute('data-toggle-password'))el.closest('form').querySelectorAll('input[type=password],input[data-was-password]').forEach(i=>{i.dataset.wasPassword='true';i.type=el.checked?'text':'password';});if(['avatar-file','broadcast-photo'].includes(el.id)){const file=el.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('Выберите изображение');if(file.size>8*1024*1024)return toast('Выберите фото размером до 8 МБ');const reader=new FileReader();reader.onload=()=>{if(el.id==='broadcast-photo'){state.broadcast=Object.fromEntries(new FormData(document.getElementById('broadcast-form')));}if(el.id==='avatar-file')state.avatar=reader.result;else state.broadcastPhoto=reader.result;render();if(state.broadcastPhoto){const preview=document.querySelector('.broadcast-card .avatar');if(preview)preview.innerHTML=`<img alt="Фото для эфира" src="${state.broadcastPhoto}">`;}toast('Фото добавлено только в прототип');};reader.readAsDataURL(file);}});
document.addEventListener('submit',ev=>{const form=ev.target;if(!form.id)return;ev.preventDefault();const data=Object.fromEntries(new FormData(form));
if(form.id==='login-form'){navigate('home');toast('Тестовый вход выполнен');}
if(form.id==='register-form'){state.pendingUser=data;state.verifyPurpose='register';navigate('verify');}
if(form.id==='reset-form'){state.verifyPurpose='reset';navigate('verify');}
if(form.id==='verify-form'){if(data.code!=='123456'){state.authError='Введите демонстрационный код 123456.';render();return;}if(state.verifyPurpose==='register'){state.nick=state.pendingUser?.nick||defaults.nick;state.club=Number(state.pendingUser?.club||0);save();navigate('home');toast('Демонстрационный аккаунт создан');}else if(state.verifyPurpose==='reset'){modal('Новый пароль',`<form id="new-password-form">${field('Новый пароль','newPassword','password','','required minlength="8" autocomplete="off"')}<button class="primary block" style="margin-top:22px" type="submit">Сохранить пароль</button></form><div class="note">Изменение только в демонстрационном сценарии.</div>`);}else{state.emailVerified=true;navigate('settings');toast('Почта подтверждена в прототипе');}}
if(form.id==='new-password-form'){navigate('login');toast('Пароль обновлён в демонстрационном сценарии');}
if(form.id==='profile-form'){state.nick=data.nick;state.birth=data.birth;save();render();toast('Профиль сохранён в прототипе');}
if(form.id==='password-form'){toast('Пароль обновлён в демонстрационном сценарии');form.reset();}
if(form.id==='broadcast-form'){state.broadcast=data;save();toast('Анкета сохранена в прототипе');}
if(form.id==='support-form'){modal('Обращение принято',`<div class="modal-success">${ic('check')}</div><p>Тема: ${esc(data.topic)}<br>Сообщение сохранено только в демонстрации.</p>`);form.reset();}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeModal();closeReview();}if(ev.key==='Tab'){const container=document.querySelector('.modal')||document.querySelector('.review-drawer-panel');if(!container)return;const els=[...container.querySelectorAll('button,a,input,select,textarea')].filter(el=>!el.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(renderers[p])navigate(p);});
const initial=location.hash.slice(1);if(renderers[initial])state.page=initial;
render();
})();
</script>
</body>
</html>
